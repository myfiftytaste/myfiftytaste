name: Test lot 4 (temporaire, à supprimer avant fusion)

on:
  push:
    branches: [v3/lot4-recalibrage]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/mainstream_estimate.py
      - name: Pipeline complet avec le recalibrage activé (date avancée dans ce test seulement)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          sed -i 's/datetime(2026, 11, 1, tzinfo=UTC)/datetime(2026, 10, 1, tzinfo=UTC)/' scripts/mainstream_estimate.py
          for u in tanguytare picolifl mathmon julescall1 tobiashottin; do
            python scripts/build_full_profile.py $u > /tmp/$u.log 2>&1 || { echo "ECHEC $u"; tail -20 /tmp/$u.log; }
            sleep 5
          done
          python - <<'PY' > data/audit/test_lot4.md
          import json, pathlib
          for u in "tanguytare picolifl mathmon julescall1 tobiashottin".split():
              p = pathlib.Path(f"data/output/{u}_profile_metrics.json")
              if not p.exists():
                  print(f"- {u} : pas de métriques"); continue
              r = json.loads(p.read_text())["radar_scores"]
              m, o = r["mainstreamness"], r["oldness"]
              d = json.loads(pathlib.Path(f"data/output/{u}_display_profile.json").read_text())
              axes = (d.get("radar_editorial") or {}).get("axes") or {}
              print(f"- {u} : mainstream cran {m['value_5']} (film du milieu {m.get('median_views')} vues, {m.get('films_counted')} films dont {m.get('films_estimated')} estimés ; ancien % {round(m['raw_value'] or 0, 1)}) · époque cran {o['value_5']} (âge moyen {round(o['raw_value'], 1)} ans) · textes : {axes.get('mainstreamness', {}).get('title')} / {axes.get('oldness', {}).get('title')}")
          PY
          cat data/audit/test_lot4.md
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/audit/test_lot4.md
          git commit -m "Résultat du test lot 4 [skip ci]"
          git push
