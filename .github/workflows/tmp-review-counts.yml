name: Temporaire - nombres de reviews (anonymes)
on:
  push:
    branches: [tmp/review-counts]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "psycopg[binary]"
      - env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY' > review_counts.txt
          import os, psycopg
          url = os.environ["DATABASE_URL"].replace("postgres://", "postgresql://", 1)
          with psycopg.connect(url) as c:
              rows = c.execute("""SELECT (metrics->'coverage'->>'review_count')::int FROM profile_cache
                                  WHERE (metrics->'coverage'->>'total_films_analyzed')::int >= 20 ORDER BY 1""").fetchall()
          print(",".join(str(r[0]) for r in rows))
          PY
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add review_counts.txt; git commit -m "nombres anonymes [skip ci]"; git push
