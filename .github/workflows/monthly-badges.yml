name: Badges du mois (Hall of Fame)

# Le 1er de chaque mois, attribue les badges du mois qui vient de se terminer
# (scripts/attribute_badges.py, règles du lot 6). Relançable sans risque :
# un badge déjà attribué n'est jamais dupliqué. Le bouton « Run workflow »
# permet aussi de traiter un mois précis à la main.
on:
  schedule:
    - cron: '20 1 1 * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'Mois à traiter (AAAA-MM) ; vide = le mois précédent'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  badges:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Attribue les badges
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MONTH: ${{ github.event.inputs.month }}
        run: python scripts/attribute_badges.py ${MONTH:+"$MONTH"}
      - name: Badges Fiftyguess (meilleur temps moyen, série de 4 semaines)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MONTH: ${{ github.event.inputs.month }}
        run: python scripts/attribute_game_badges.py ${MONTH:+"$MONTH"}
      # Durées de conservation annoncées sur /confidentialite (lot 9).
      - name: Purge des données expirées
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/purge_retention.py
