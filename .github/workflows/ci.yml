name: CI

on:
  pull_request:
  push:
    branches: [main, release-v3]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt -r requirements-megabank.txt
      - name: Compile les scripts
        run: python -m compileall -q worker.py scripts
      - name: Auto-tests Python
        run: |
          for t in scripts/test_*.py; do echo "== $t"; python "$t"; done
      # TMDB_API_KEY vide : le test QA doit rester hors ligne (avec une vraie clé, il fait des appels réels).
      - name: Test QA des seuils de profil
        env:
          TMDB_API_KEY: ''
        run: python scripts/qa_profile_thresholds.py

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next lint
      - name: Auto-tests TypeScript
        run: |
          for t in lib/*.test.mjs; do echo "== $t"; node "$t"; done
      # Informatif : les failles restantes de Next 14 n'ont pas de correctif dans cette ligne
      # (voir audit, chantier Next 15/16). Visible dans les logs sans bloquer.
      - name: Audit npm
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  # Seul check à rendre obligatoire dans la protection de branche : un job ignoré compterait
  # comme réussi, celui-ci échoue si l'un des deux autres n'a pas réussi.
  ci:
    if: always()
    needs: [python, web]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.python.result }}" = success && test "${{ needs.web.result }}" = success
